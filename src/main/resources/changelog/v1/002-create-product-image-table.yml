databaseChangeLog:
  - changeSet:
      id: product-image-table
      author: rahimovaaydan
      changes:
        - createTable:
            tableName: product_image
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: image_url
                  type: VARCHAR(500)

              - column:
                  name: is_primary
                  type: BOOLEAN

              - column:
                  name: display_order
                  type: INTEGER

              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_product_image_product
                    references: product(id)

        - createIndex:
            tableName: product_image
            indexName: idx_product_image_product_id
            columns:
              - column:
                  name: product_id
