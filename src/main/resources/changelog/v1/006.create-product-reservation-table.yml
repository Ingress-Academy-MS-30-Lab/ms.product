databaseChangeLog:
  - changeSet:
      id: create-product-reservation-table
      author: aydanrahimova
      changes:
        - createTable:
            tableName: product_reservation
            columns:
              - column:
                  name: uuid
                  type: VARCHAR
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: product_group_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: reserved_quantity
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: reserved_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: reservation_status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
                    defaultValue: 'ACTIVE'
              - column:
                  name: order_status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: product_reservation
            baseColumnNames: product_group_id
            referencedTableName: product_group
            referencedColumnNames: id
            constraintName: fk_product_reservation_product_group

        - addForeignKeyConstraint:
            baseTableName: product_reservation
            baseColumnNames: product_id
            referencedTableName: product
            referencedColumnNames: id
            constraintName: fk_product_reservation_product
