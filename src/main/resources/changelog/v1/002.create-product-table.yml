databaseChangeLog:
  - changeSet:
      id: create-product-table
      author: aydanrahimova
      changes:
        - createTable:
            tableName: product
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: product_group_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: stock_quantity
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: reserved_quantity
                  type: BIGINT
                  constraints:
                    nullable: false
                    defaultValue: 0
              - column:
                  name: available_quantity
                  type: BIGINT
              - column:
                  name: price
                  type: DECIMAL(19,2)
              - column:
                  name: sale_price
                  type: DECIMAL(19,2)
              - column:
                  name: on_sale
                  type: boolean
              - column:
                  name: in_stock
                  type: BOOLEAN
                  constraints:
                    nullable: false
                    defaultBooleanValue: true
              - column:
                  name: is_active
                  type: BOOLEAN
                  constraints:
                    nullable: false
                    defaultBooleanValue: true
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP

        - addForeignKeyConstraint:
            baseTableName: product
            baseColumnNames: product_group_id
            referencedTableName: product_group
            referencedColumnNames: id
            constraintName: fk_product_product_group
